<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Científica - Proyecto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div id="operation-screen"></div>
            <div id="current-screen">0</div>
        </div>
        
 <div class="keypad">
<button class="btn btn-danger" onclick="allClear()">AC</button><button class="btn btn-warning" onclick="deleteChar()">DEL</button>
<button class="btn btn-sci" onclick="setOperator('%')">%</button>
<button class="btn btn-operator" onclick="setOperator('/')">÷</button>

<button class="btn btn-sci" onclick="setOperator('^')">^</button>
<button class="btn btn-sci" onclick="scientific('sqrt')">√</button>
<button class="btn btn-sci" onclick="scientific('cos')">cos</button>
<button class="btn btn-sci" onclick="scientific('tan')">tan</button>

<button class="btn" onclick="appendNumber('7')">7</button>
<button class="btn" onclick="appendNumber('8')">8</button>
<button class="btn" onclick="appendNumber('9')">9</button>
<button class="btn btn-operator" onclick="setOperator('*')">×</button>

<button class="btn" onclick="appendNumber('4')">4</button>
<button class="btn" onclick="appendNumber('5')">5</button>
<button class="btn" onclick="appendNumber('6')">6</button>
<button class="btn btn-operator" onclick="setOperator('-')">-</button>

<button class="btn" onclick="appendNumber('1')">1</button>
<button class="btn" onclick="appendNumber('2')">2</button>
<button class="btn" onclick="appendNumber('3')">3</button>
 <button class="btn btn-operator" onclick="setOperator('+')">+</button>

<button class="btn btn-double" onclick="appendNumber('0')">0</button>
<button class="btn" onclick="appendNumber('.')">.</button>
<button class="btn btn-equal" onclick="calculate()">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
